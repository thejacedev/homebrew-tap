name: Test install
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          brew tap thejacedev/tap "$GITHUB_WORKSPACE"
          brew trust thejacedev/tap
      - name: Style and audit
        run: |
          brew style --cask thejacedev/tap/noteriv
          brew audit --cask thejacedev/tap/noteriv
      - name: Install
        run: |
          brew install --cask thejacedev/tap/noteriv
          test -d /Applications/Noteriv.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Noteriv.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" /Applications/Noteriv.app/Contents/Info.plist
  # What a new user sees with the one-line command from the README.
  fresh-user:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: One-line install without trusting the tap first
        run: |
          brew --version
          brew install --cask thejacedev/tap/noteriv < /dev/null && test -d /Applications/Noteriv.app && echo "ONE-LINE INSTALL WORKED"
